<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="icons/favicon.svg" type="image/x-icon" />
    <script type="module" src="index.js"></script>
    <title>To-do</title>
  </head>
  <body>
    <header class="hide">
      <h2 class="header-text"></h2>
    </header>
    <main>
      <section class="intro-screen">
        <div class="intro-container">
          <h1 class="intro-title">Welcome to Taskmaster</h1>
          <div>
            <input
              type="text"
              name=""
              id="intro-name"
              placeholder="Your name"
            />
          </div>
        </div>
      </section>
      <div class="sidebar hide">
        <button
          class="sidebar-btn"
          id="all"
          data-action="filter"
          data-filter="All"
        >
          <svg
            width="24px"
            height="24px"
            viewBox="0 0 24 24"
            fill="none"
            class="svg-icon"
            xmlns="http://www.w3.org/2000/svg"
          >

              fill-rule="evenodd"
              clip-rule="evenodd"

              fill="#056dfa"
            />
          </svg>
          <span class="lable">All tasks</span>
        </button>
        <button
          class="sidebar-btn"
          id="done"
          data-action="filter"
          data-filter="Completed"
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 800 800"
            fill="none"
            class="svg-icon"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M75 200C75 186.193 86.193 175 100 175H666.667C680.473 175 691.667 186.193 691.667 200C691.667 213.807 680.473 225 666.667 225H100C86.193 225 75 213.807 75 200ZM75 366.667C75 352.86 86.193 341.667 100 341.667H300C313.807 341.667 325 352.86 325 366.667C325 380.473 313.807 391.667 300 391.667H100C86.193 391.667 75 380.473 75 366.667ZM75 533.333C75 519.527 86.193 508.333 100 508.333H333.333C347.14 508.333 358.333 519.527 358.333 533.333C358.333 547.14 347.14 558.333 333.333 558.333H100C86.193 558.333 75 547.14 75 533.333Z"

            />
          </svg>
          <span class="lable">Completed tasks</span>
        </button>
        <button
          class="sidebar-btn"
          id="favorites"
          data-action="filter"
          data-filter="Favorite"
        >
          <svg
            width="24px"
            height="24px"
            viewBox="0 0 24 24"
            fill="none"
            class="svg-icon"
            xmlns="http://www.w3.org/2000/svg"
          >

              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M2.25 6C2.25 5.58579 2.58579 5.25 3 5.25H20C20.4142 5.25 20.75 5.58579 20.75 6C20.75 6.41421 20.4142 6.75 20 6.75H3C2.58579 6.75 2.25 6.41421 2.25 6ZM2.25 11C2.25 10.5858 2.58579 10.25 3 10.25H9C9.41421 10.25 9.75 10.5858 9.75 11C9.75 11.4142 9.41421 11.75 9 11.75H3C2.58579 11.75 2.25 11.4142 2.25 11ZM2.25 16C2.25 15.5858 2.58579 15.25 3 15.25H10C10.4142 15.25 10.75 15.5858 10.75 16C10.75 16.4142 10.4142 16.75 10 16.75H3C2.58579 16.75 2.25 16.4142 2.25 16Z"

            />

              d="M13 11.7148C13 13.4673 15.1633 15.3304 16.4901 16.3082C16.9442 16.643 17.1713 16.8103 17.5 16.8103C17.8287 16.8103 18.0558 16.643 18.5099 16.3082C19.8367 15.3304 22 13.4674 22 11.7147C22 9.03758 19.5249 8.03806 17.5 10.1061C15.4751 8.03806 13 9.03758 13 11.7148Z"
              fill="#FF5C5C"
            />
          </svg>
          <span class="lable">Favorite tasks</span>
        </button>

          id="urgent"
          data-action="filter"
          data-filter="Urgent"
        >

            height="24"
            viewBox="0 0 800 800"
            fill="none"
            class="svg-icon"
            xmlns="http://www.w3.org/2000/svg"
          >

              fill-rule="evenodd"
              clip-rule="evenodd"

            />

            />
            <path
              d="M464.993 528.184H728.405L596.699 297.748L464.993 528.184Z"
              fill="#FFD02A"
            />
            <path
              d="M596.699 449.671C592.81 449.62 589.095 448.054 586.345 445.304C583.595 442.554 582.029 438.838 581.978 434.95V366.251C581.978 362.346 583.528 358.602 586.29 355.841C589.05 353.08 592.795 351.529 596.699 351.529C600.603 351.529 604.348 353.08 607.108 355.841C609.869 358.602 611.42 362.346 611.42 366.251V434.95C611.369 438.838 609.803 442.554 607.053 445.304C604.303 448.054 600.587 449.62 596.699 449.671Z"
              fill="#056DFA"
            />
            <path
              d="M596.699 508.556C592.81 508.505 589.095 506.939 586.345 504.189C583.595 501.439 582.029 497.723 581.978 493.835V484.021C581.978 480.117 583.528 476.372 586.29 473.612C589.05 470.85 592.795 469.299 596.699 469.299C600.603 469.299 604.348 470.85 607.108 473.612C609.869 476.372 611.42 480.117 611.42 484.021V493.835C611.369 497.723 609.803 501.439 607.053 504.189C604.303 506.939 600.587 508.505 596.699 508.556Z"
              fill="#056DFA"
            />
          </svg>
          <span class="lable">Urgent tasks</span>
        </button>
      </div>
      <div class="task-container hide">
        <div>
          <button class="todo-btn">Add task</button>
          <input type="text" id="todo-text" required />
          <button class="todo-settings" id="date-btn">
            <img src="icons/date.svg" class="task-extras-icon" />Set date
          </button>
          <input type="date" id="todo-date" min="" class="hide" />
          <button class="todo-settings" id="location-btn">
            <span>
              <img
                src="icons/location.svg"
                alt=""
                class="task-extras-icon"
              />Set location
            </span>
          </button>
          <input
            type="text"
            id="todo-location"
            class="hide"
            placeholder="Location"
          />
        </div>
        <div class="list-container">
          <h1 class="task-title">All tasks</h1>
          <ul class="todo-container"></ul>
          <!-- <ul class="todo-container-done"></ul> -->
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
